plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'dagger.hilt.android.plugin'
    id "androidx.navigation.safeargs.kotlin"
    id 'io.sentry.android.gradle'
    id 'androidx.room'
}

android {
    namespace "com.turingheights.wally"
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.turingheights.wally"
        manifestPlaceholders = [appName: "Wally"]
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 5
        versionName "2.0.1"

        testInstrumentationRunner "com.turingheights.wally.HiltTestRunner"
    }

    room {
        schemaDirectory "$projectDir/schemas"
    }

    def wallyPropertiesFile = rootProject.file "wally.properties"
    def wallyProperties = new Properties()
    wallyProperties.load new FileInputStream(wallyPropertiesFile)

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {

        debug {
            buildConfigField("String", "BASE_API_URL", wallyProperties["DEV_API_BASE_URL"])
            buildConfigField("String", "API_KEY", wallyProperties["API_KEY"])

            applicationIdSuffix ".debug"
            manifestPlaceholders = [appName: "Wally (Debug)"]
        }

        release {
            buildConfigField("String", "BASE_API_URL", wallyProperties["PROD_API_BASE_URL"])
            buildConfigField("String", "API_KEY", wallyProperties["API_KEY"])
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {

    // Photo Viewer
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"

    // Paging 3
    implementation "androidx.paging:paging-runtime-ktx:$paging_version"

    // Navigation Component
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // Hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    kapt "com.google.dagger:hilt-compiler:$hilt_version"

    // Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    // Room
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // optional - Kotlin Extensions and Coroutines support for Room
    implementation "androidx.room:room-ktx:$room_version"

    // Datastore preference library
    implementation "androidx.datastore:datastore-preferences:$datastore_version"

    // Glide image loading library
    implementation "com.github.bumptech.glide:glide:$glide_version"
    kapt "com.github.bumptech.glide:compiler:$glide_version"

    // Retrofit HTTP library
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"

    // OkHttp logging interceptor
    implementation "com.squareup.okhttp3:logging-interceptor:$logging_interceptor_version"

    // Timber logging library
    implementation "com.jakewharton.timber:timber:$timber_version"

    // Sentry crashlytics
    implementation "io.sentry:sentry-android:$sentry_version"

    // Shimmer
    implementation "com.facebook.shimmer:shimmer:$shimmer_version"

    // Image Cropper
    api "com.github.CanHub:Android-Image-Cropper:$image_cropper"

    // Dexter
    implementation "com.karumi:dexter:$dexter_version"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "io.mockk:mockk:1.13.8"
    testImplementation "com.google.truth:truth:1.1.5"
    testImplementation "androidx.paging:paging-common:$paging_version"

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
    kaptAndroidTest "com.google.dagger:hilt-compiler:$hilt_version"
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
    androidTestImplementation "androidx.arch.core:core-testing:2.2.0"
    androidTestImplementation "com.google.truth:truth:1.1.5"
}