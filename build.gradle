// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.4.10'
    ext {
        paging_version = "3.1.1"
        nav_version = "2.9.8"
        hilt_version = '2.60.1'
        coroutines_version = "1.3.9"
        room_version = "2.8.4"
        glide_version = "4.12.0"
        retrofit_version = "2.9.0"
        datastore_version = "1.0.0"
        logging_interceptor_version = "4.9.1"
        timber_version = "4.7.1"
        sentry_version = "8.48.0"
        shimmer_version = "0.5.0"
        image_cropper = "3.2.1"
        dexter_version = "6.2.2"
        lifecycle_version = "2.11.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files

        // Hilt
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"

        // Navigation SafeArgs
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"

        // https://github.com/getsentry/sentry-android-gradle-plugin/releases
        classpath 'io.sentry:sentry-android-gradle-plugin:6.17.0'
        classpath "androidx.room:room-gradle-plugin:2.6.1"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}